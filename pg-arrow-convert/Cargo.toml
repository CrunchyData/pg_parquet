[package]
name = "pg-arrow-convert"
description = "Postgres tuples to Arrow record batches and back, for every format provider to share"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true

[features]
pg19 = ["pgrx/pg19"]
pg18 = ["pgrx/pg18"]
pg17 = ["pgrx/pg17"]
pg16 = ["pgrx/pg16"]
pg15 = ["pgrx/pg15"]
pg14 = ["pgrx/pg14"]

[dependencies]
arrow = { workspace = true, features = ["canonical_extension_types"] }
arrow-cast = { version = "60", default-features = false }
arrow-schema = { version = "60", default-features = false, features = ["canonical_extension_types"] }
once_cell = "1"
# WKB metadata types for the geometry/geography mapping. Named for parquet, but it is the
# geoarrow metadata encoding rather than anything about parquet files.
parquet-geospatial = "60"
pgrx.workspace = true
serde_json = "1"

[build-dependencies]
cfg_aliases = "0.2"
