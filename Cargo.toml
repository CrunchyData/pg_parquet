# the provider itself is a crate of its own: no pgrx, no Postgres, testable with plain
# `cargo test`. The root package is a workspace member automatically.
[workspace]
members = ["parquet-format"]

[package]
name = "pg_parquet"
version = "0.6.0"
edition = "2021"
license-file = "LICENSE"

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg19"]
pg19 = ["pgrx/pg19", "pgrx-tests/pg19"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15"]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14"]
pg_test = []

[dependencies]
arrow = {version = "60", default-features = false}
arrow-cast = {version = "60", default-features = false}
arrow-schema = {version = "60", default-features = false, features = ["canonical_extension_types"]}
bytes = "1"
futures = "0.3"
glob = "0.3"
libc = {version = "0.2", default-features = false }
object_store = {version = "0.14", default-features = false, features = ["aws", "azure", "fs", "gcp", "http"]}
# the object store access layer: uri parsing, credentials, clients and their cache. Shared
# with pg_object_store and with every other extension that reaches an object store.
object-store-core = {git = "ssh://git@github.com/CrunchyData/pg_object_store.git", branch = "main"}
once_cell = "1"
parquet = {version = "60", default-features = false, features = [
    "arrow",
    "crc",
    "snap",
    "brotli",
    "flate2-zlib-rs",
    "simdutf8",
    "lz4",
    "zstd",
    "object_store",
    "arrow_canonical_extension_types",
    "geospatial",
]}
parquet-geospatial = "60"
pgrx = "=0.19.3"
serde = "1"
serde_json = "1"
url = "2"

[dev-dependencies]
pgrx-tests = "=0.19.3"

[build-dependencies]
cfg_aliases = "0.2"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
