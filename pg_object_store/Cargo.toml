[package]
name = "pg_object_store"
description = "Postgres extension that owns object store access: uris, credentials, roles, clients"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["pg19"]
pg19 = ["pgrx/pg19", "pgrx-tests/pg19"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15"]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14"]
pg_test = []

[dependencies]
# the vtable ABI is declared once, in the crate dependents link, and published from here
object-store-client.workspace = true
object-store-core.workspace = true

bytes.workspace = true
chrono.workspace = true
futures.workspace = true
object_store.workspace = true
pgrx.workspace = true
# io-util on top of the workspace features: finishing a streaming upload is
# `AsyncWriteExt::shutdown` on object_store's BufWriter.
tokio = { workspace = true, features = ["io-util"] }

[build-dependencies]
cfg_aliases = "0.2"

[dev-dependencies]
pgrx-tests = "=0.19.3"
